version: "2"
linters:
  enable:
    - misspell
    - prealloc
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - ^data(/|$)
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - ^data(/|$)
      - third_party$
      - builtin$
      - examples$
