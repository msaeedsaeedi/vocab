linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - prealloc
    - unconvert
    - wastedassign

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gofmt:
    simplify: true
  staticcheck:
    checks:
      - all

issues:
  exclude-dirs:
    - data
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
