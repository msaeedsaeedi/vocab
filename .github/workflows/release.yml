name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install makensis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis

      - name: Build NSIS installer
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          for f in dist/*_windows_amd64.zip; do
            [ -f "$f" ] && ZIP="$f" && break
          done
          if [ -z "${ZIP:-}" ]; then echo "No amd64 zip found in dist/"; ls dist/; exit 1; fi
          mkdir -p dist/installer
          unzip -j "$ZIP" "vocab.exe" -d dist/installer/
          cp icon.ico README.md LICENSE dist/installer/
          LEXICON_TAG="$(gh release view --repo msaeedsaeedi/lexicon --json tagName -q .tagName)"
          gh release download "$LEXICON_TAG" --repo msaeedsaeedi/lexicon \
            --pattern '*.tar.gz' --pattern '*.tar.gz.sha256' --dir dist
          ARCHIVE="$(find dist -maxdepth 1 -name '*.tar.gz' | head -n 1)"
          CHECKSUM="$(find dist -maxdepth 1 -name '*.tar.gz.sha256' | head -n 1)"
          test -n "$ARCHIVE" && test -n "$CHECKSUM"
          EXPECTED="$(cut -d ' ' -f1 "$CHECKSUM")"
          ACTUAL="$(sha256sum "$ARCHIVE" | cut -d ' ' -f1)"
          test "$EXPECTED" = "$ACTUAL"
          tar -xzf "$ARCHIVE" -C dist/installer
          BUNDLE_DIR="$(find dist/installer -mindepth 1 -maxdepth 1 -type d -name 'lexicon-*' | head -n 1)"
          test -n "$BUNDLE_DIR"
          mv "$BUNDLE_DIR" dist/installer/lexicon
          cd dist/installer
          sed "s/{{.Version}}/$TAG/g; s/{{.Name}}/Vocab-$TAG-windows-amd64-online-setup/g; s/{{.Binary}}/vocab.exe/g" \
            ../../installer.nsi > online-installer.nsi
          makensis online-installer.nsi
          sed "s/{{.Version}}/$TAG/g; s/{{.Name}}/Vocab-$TAG-windows-amd64-offline-setup/g; s/{{.Binary}}/vocab.exe/g" \
            ../../installer.nsi > offline-installer.nsi
          makensis /DOFFLINE offline-installer.nsi
          mv "Vocab-$TAG-windows-amd64-online-setup.exe" "../Vocab-$TAG-windows-amd64-online-setup.exe"
          mv "Vocab-$TAG-windows-amd64-offline-setup.exe" "../Vocab-$TAG-windows-amd64-offline-setup.exe"

      - name: Upload installer to release
        run: |
          gh release upload "${{ github.ref_name }}" dist/*-setup.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
