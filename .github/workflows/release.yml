name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install makensis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis

      - name: Build NSIS installer
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p dist/installer
          unzip -j "dist/vocab_${TAG}_windows_amd64.zip" "vocab.exe" -d dist/installer/
          cp icon.ico README.md LICENSE dist/installer/
          sed "s/{{.Version}}/$TAG/g; s/{{.Name}}/Vocab-$TAG-windows-amd64-setup/g; s/{{.Binary}}/vocab.exe/g" \
            installer.nsi > dist/installer/installer.nsi
          cd dist/installer
          makensis installer.nsi
          mv "Vocab-$TAG-windows-amd64-setup.exe" "../Vocab-$TAG-windows-amd64-setup.exe"

      - name: Upload installer to release
        run: |
          gh release upload "${{ github.ref_name }}" dist/*-setup.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
